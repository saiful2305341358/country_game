<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Offline Four-of-a-Kind Strategic Country Card Game.">
  <meta property="og:title" content="Country Card Game">
  <meta property="og:description" content="Offline Four-of-a-Kind Strategic Country Card Game.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Country Card Game">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Country Card Game</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #04140E;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background: radial-gradient(circle at center, #0F3B2C 0%, #09251B 60%, #04140E 100%);
      color: #FFD700;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 215, 0, 0.2);
      border-top-color: #FFD700;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #FFD700;
      margin-bottom: 6px;
    }
    .loading-sub {
      font-size: 12px;
      color: rgba(255, 224, 130, 0.7);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-title">COUNTRY CARD GAME</div>
    <div class="loading-sub">Preparing Table...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
